[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-fleet"
version = "0.1.0"
description = "Warehouse mobile robot fleet (Pioneer P3-DX) with A* path planning in CoppeliaSim via the ZeroMQ remote API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "coppeliasim-zmqremoteapi-client>=2.0.0",
    "numpy>=1.21",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
